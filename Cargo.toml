[workspace]
resolver = "2"
members = [
    "crates/loneboth-core",
    "crates/loneboth-daemon",
    "crates/loneboth-client",
    "crates/loneboth-ai",
    "crates/loneboth-gui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["nanaisisi <131863615+nanaisisi@users.noreply.github.com>"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
jiff = { version = "1.0.2", features = ["serde", "tz-system"] }
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
anyhow = "1.0.104"
thiserror = "2.0.21"
rand = "0.10.4"
clap = { version = "4.6.9", features = ["derive"] }
reqwest = { version = "0.13.5", features = ["json"] }
axum = "0.8.9"
windows-sys = "0.61.2"
