[package]
name = "loneboth-gui"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
loneboth-core = { path = "../loneboth-core" }
windows-reactor = { git = "https://github.com/microsoft/windows-rs", branch = "master" }
nanai-gna-dll-load = { git = "https://github.com/nanaisisi/nanai-gna-dll-load.git" }

anyhow = "1.0.104"
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { version = "4.6.9", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_SystemInformation",
    "Win32_System_ProcessStatus",
    "Win32_System_LibraryLoader",
    "Win32_Graphics_Dxgi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
] }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
windows-reactor-setup = { git = "https://github.com/microsoft/windows-rs", branch = "master" }
